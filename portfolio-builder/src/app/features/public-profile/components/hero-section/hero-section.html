<section class="hero-container" id="hero">
  @if (isEditable()) {
    <button type="button" class="btn-section-edit" (click)="editRequested.emit()" title="Quick edit Hero Section">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
      </svg>
      <span>Edit Hero</span>
    </button>
  }

  <div class="hero-content">
    @if (data().avatarUrl) {
      <div class="avatar-wrapper">
        <img [src]="data().avatarUrl" [alt]="data().fullName || 'Profile Avatar'" class="hero-avatar" />
        <div class="status-indicator" title="Available for opportunities"></div>
      </div>
    }

    <div class="text-block">
      @if (data().location) {
        <div class="location-badge">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
            <circle cx="12" cy="10" r="3"></circle>
          </svg>
          <span>{{ data().location }}</span>
        </div>
      }

      <h1 class="hero-name">{{ data().fullName || 'Portfolio Owner' }}</h1>
      <h2 class="hero-tagline">{{ data().tagline || 'Software Engineer & Architect' }}</h2>

      @if (data().bio) {
        <p class="hero-bio">{{ data().bio }}</p>
      }

      <div class="hero-actions">
        @if (data().ctaText) {
          <a [href]="data().ctaLink || '#experience'" class="btn-hero-primary">
            <span>{{ data().ctaText }}</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </a>
        }
        <a href="#about" class="btn-hero-secondary">Learn More</a>
      </div>
    </div>
  </div>
</section>
