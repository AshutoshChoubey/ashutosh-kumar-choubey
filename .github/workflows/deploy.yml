name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: 'portfolio-builder/package-lock.json'

      - name: Install dependencies
        working-directory: portfolio-builder
        run: npm ci

      - name: Build Angular Application
        working-directory: portfolio-builder
        run: npm run build

      - name: Create 404.html fallback for SPA routing
        run: |
          cp portfolio-builder/dist/portfolio-builder/browser/index.html portfolio-builder/dist/portfolio-builder/browser/404.html

      - name: Upload Pages artifact (Build Output Path)
        uses: actions/upload-pages-artifact@v3
        with:
          # Build artifact path for GitHub Pages deployment
          path: 'portfolio-builder/dist/portfolio-builder/browser'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
